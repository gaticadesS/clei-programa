<head>

<title>Programa · 52ª CLEI 2026</title>
<meta name="description" content="Programa por día del CLEI 2026 en el Instituto Tecnológico Autónomo de México.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#14273f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1319">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314273f'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3E52%3C/text%3E%3C/svg%3E">
<style>
/* ======================================================================
   PALETA — para cambiar los colores institucionales basta con editar
   estos valores. Nada más en la hoja de estilos usa colores directos.
   Los colores de cada track (verde IA, rosa LAWCC, etc.) NO están aquí:
   vienen del bloque de datos, porque son los mismos del programa impreso.
   ====================================================================== */
:root{
  --fondo:#f2f4f7;        /* fondo general de la página            */
  --superficie:#ffffff;   /* fondo de las tarjetas                 */
  --tinta:#14181f;        /* texto principal                       */
  --suave:#55606f;        /* texto secundario                      */
  --tenue:#646d7b;        /* texto de apoyo y separadores          */
  --linea:#dfe4eb;        /* bordes                                */
  --acento:#1b5091;       /* azul: enlaces y filtro activo         */
  --acento-claro:#e7eef7; /* fondo del filtro activo               */
  --solido:#14273f;       /* encabezado y día seleccionado         */
  --solido-txt:#ffffff;   /* texto sobre el encabezado             */
  --solido-sub:#9db0c8;   /* subtítulo del encabezado              */
  --vivo:#0f7a54;         /* marca de "en curso"                   */
  --radio:10px; --ancho:640px;
}

/* Modo oscuro automático: se activa solo si el celular lo tiene puesto.
   Sirve en auditorios con poca luz y ahorra batería en pantallas OLED. */
@media (prefers-color-scheme: dark){
  :root{
    --fondo:#0e1319; --superficie:#171d25; --tinta:#eaeef4; --suave:#a3adbb;
    --tenue:#828c9a; --linea:#252d38; --acento:#8fb8ea; --acento-claro:#182534;
    --solido:#1d2b3d; --solido-txt:#edf1f7; --solido-sub:#94a2b4; --vivo:#107f57;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.env{max-width:var(--ancho); margin:0 auto; padding:0 14px 64px}

/* ---------- encabezado ---------- */
.cab{background:var(--solido); color:var(--solido-txt); padding:16px 0 14px; margin:0 -14px 0}
.cab .env{padding-bottom:0}
.cab h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-.01em}
.cab p{margin:2px 0 0; font-size:13px; color:var(--solido-sub)}

/* ---------- barra pegajosa ---------- */
.barra{position:sticky; top:0; z-index:20; background:var(--superficie);
  border-bottom:1px solid var(--linea); margin:0 -14px; padding:0 14px;
  box-shadow:0 1px 0 rgba(0,0,0,.02)}
.dias{display:flex; gap:4px; overflow-x:auto; padding:8px 0 8px; scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:1 0 auto; min-width:60px; border:1px solid var(--linea); background:var(--superficie);
  border-radius:var(--radio); padding:6px 10px; cursor:pointer; text-align:center;
  font:inherit; color:var(--suave); line-height:1.2}
.dia b{display:block; font-size:11px; font-weight:700; letter-spacing:.08em}
.dia span{display:block; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
.dia[aria-pressed="true"]{background:var(--solido); border-color:var(--solido); color:var(--solido-txt)}
.dia:focus-visible,.chip:focus-visible,.tarjeta summary:focus-visible,.btn:focus-visible{
  outline:2px solid var(--acento); outline-offset:2px}

.busca{display:flex; gap:8px; padding-bottom:8px; align-items:center}
.busca input{flex:1; min-width:0; font:inherit; font-size:16px; padding:9px 12px;
  border:1px solid var(--linea); border-radius:var(--radio); background:var(--fondo); color:var(--tinta)}
.busca input::placeholder{color:var(--tenue)}
.btn{font:inherit; font-size:13px; padding:9px 12px; border:1px solid var(--linea);
  background:var(--superficie); border-radius:var(--radio); cursor:pointer; color:var(--suave); white-space:nowrap}

.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; font:inherit; font-size:13px; padding:5px 11px; border-radius:999px;
  border:1px solid var(--linea); background:var(--superficie); color:var(--suave); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px}
.chip[aria-pressed="true"]{background:var(--acento-claro); border-color:var(--acento); color:var(--acento); font-weight:600}
.punto{width:9px; height:9px; border-radius:3px; flex:0 0 auto}

/* ---------- franjas de hora ---------- */
.franja{display:flex; align-items:baseline; gap:10px; margin:22px 0 8px}
.franja .hora{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.franja .raya{flex:1; height:1px; background:var(--linea)}
.franja .ahora{font-size:11px; font-weight:700; letter-spacing:.06em; color:#fff;
  background:var(--vivo); padding:2px 7px; border-radius:999px}

/* ---------- tarjetas ---------- */
.tarjeta{background:var(--superficie); border:1px solid var(--linea); border-left:5px solid var(--tenue);
  border-radius:var(--radio); margin-bottom:8px; overflow:hidden}
.tarjeta summary{list-style:none; cursor:pointer; padding:11px 13px; display:block}
.tarjeta summary::-webkit-details-marker{display:none}
.sala{font-size:15px; font-weight:700; letter-spacing:-.01em}
.meta{font-size:13px; color:var(--suave); margin-top:2px}
.meta .cod{font-weight:700; color:var(--tinta)}
.sub{font-size:13px; color:var(--suave); margin-top:3px; font-style:italic}
.pie{font-size:12.5px; color:var(--acento); margin-top:6px; font-weight:600}
.tarjeta[open] .pie::after{content:" ▲"}
.tarjeta:not([open]) .pie::after{content:" ▼"}
.lista{margin:0; padding:0 13px 12px 13px; border-top:1px solid var(--linea)}
.lista li{list-style:none; font-size:14px; padding:9px 0 9px 0; border-bottom:1px solid var(--linea);
  color:var(--tinta); line-height:1.4}
.lista li:last-child{border-bottom:none}
.lista .num{display:inline-block; font-size:11px; color:var(--tenue); font-variant-numeric:tabular-nums;
  margin-right:6px; font-weight:600}
.pendiente{padding:0 13px 12px; font-size:13.5px; color:var(--suave); border-top:1px solid var(--linea)}
.pendiente strong{display:block; color:var(--tinta); font-size:14px; margin:10px 0 2px}
.tarjeta.pasada{opacity:.45}
.tarjeta.encurso{border-color:var(--vivo); box-shadow:0 0 0 1px var(--vivo)}

/* ---------- logística ---------- */
.log{display:flex; align-items:center; gap:10px; margin:8px 0; color:var(--tenue); font-size:13px}
.log .raya{flex:1; height:1px; background:var(--linea)}
.log b{font-weight:600; color:var(--suave)}

/* ---------- estados ---------- */
.vacio{text-align:center; padding:48px 20px; color:var(--suave); font-size:14.5px}
.vacio b{display:block; color:var(--tinta); font-size:16px; margin-bottom:4px}
.diares{font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--tenue);
  margin:22px 0 6px; text-transform:uppercase}
.cuenta{font-size:13px; color:var(--suave); padding:10px 0 0}

footer a{color:var(--acento)}
footer{margin-top:32px; padding-top:14px; border-top:1px solid var(--linea);
  font-size:12.5px; color:var(--tenue); line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>

ederated YOLOv8 Approach"},{"n":264,"t":"Seeing with words: an AI-based tool for automatic image description in educational materials"}]},{"id":"S090","dia":"Viernes","fecha":"2026-09-11","ini":"09:00","fin":"11:00","sala":"Sala de Conferencias","cod":"IA-4","track":"IA","grupo":"IA","tipo":"Full Papers","sub":"","chair":"","estado":"ok","pon":[{"n":131,"t":"Impact of Temporal Modelling Strategies on Spatio-Temporal Graph Neural Networks: RNNs vs Transformers"},{"n":132,"t":"An analysis of the generalization of deep neural networks for breast cancer classification in thermal images"},{"n":139,"t":"A Data-Driven System for Automated Transfer Learning Strategy Selection"},{"n":141,"t":"Evaluating the Efficacy and Efficiency of Three Knowledge Distillation Paradigms in an LLM-to-LLM Scenario"}]},{"id":"S091","dia":"Viernes","fecha":"2026-09-11","ini":"09:00","fin":"11:00","sala":"Bib1","cod":"PRACT-5","track":"PRACT","grupo":"PRACT","tipo":"Full Papers","sub":"","chair":"","estado":"ok","pon":[{"n":229,"t":"Recommendation Systems for Gamified Serious Games based on a Hybrid Multi-LLM Model and Dynamic Collaborative Filtering"},{"n":226,"t":"Distributed Reinforcement Learning for Emergent Coordination in Energy Microgrids"},{"n":228,"t":"A Diagnosis and Mitigation Approach for ESP Wells based on a Multi-LLM Hybrid Recommender"}]},{"id":"S092","dia":"Viernes","fecha":"2026-09-11","ini":"11:00","fin":"11:30","sala":"Todas","cod":"","track":"LOG","grupo":"LOG","tipo":"Receso","sub":"Coffee break","chair":"","estado":"ok","pon":[]},{"id":"S093","dia":"Viernes","fecha":"2026-09-11","ini":"11:30","fin":"13:30","sala":"Bib1","cod":"PRACT-6","track":"PRACT","grupo":"PRACT","tipo":"Full Papers","sub":"","chair":"","estado":"ok","pon":[{"n":217,"t":"Integrating Synthetic Data, Epidemiological Modeling, and Explainability for COVID-19 Forecasting"},{"n":282,"t":"Software Architecture for Model-Informed Precision Dosing: A Systematic Mapping Study"},{"n":24,"t":"Automatic Classification of Simulated Gait Patterns Associated with Cognitive Impairment Using Pose Estimation and Machine Learning"}]}]}</script>
<script>
/* ==========================================================================
   PROGRAMA DEL CLEI — lógica de la página
   Para cambiar el programa NO se toca este código: se edita el bloque de
   datos de arriba (<script id="datos">).
   ========================================================================== */
function iniciarPrograma(){
var D = JSON.parse(document.getElementById('datos').textContent);
const prog = document.getElementById('prog');
const elDias = document.getElementById('dias');
const elChips = document.getElementById('chips');
const q = document.getElementById('q');

let diaSel = null, filtro = 'TODOS';

document.getElementById('act').textContent = D.evento.actualizado;

/* --- día por defecto: hoy si el congreso está en curso, si no el primero --- */
function dos(n){ return (n<10?'0':'')+n; }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+dos(d.getMonth()+1)+'-'+dos(d.getDate()); }
var hoy = hoyISO();
/* Solo coincidencia por fecha exacta: fuera de los días del congreso
   la página abre en el primer día y no marca nada como "en curso". */
function diaDeHoy(){
  for(var i=0;i<D.dias.length;i++){ if(D.dias[i].fecha===hoy) return D.dias[i].nombre; }
  return null;
}
diaSel = diaDeHoy() || D.dias[0].nombre;

/* --- minutos desde medianoche, para saber qué está en curso --- */
function min(h){ var p=h.split(':'); return Number(p[0])*60+Number(p[1]); }
function ahoraMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function esHoy(){ return diaSel === diaDeHoy(); }

/* --- botones de día --- */
D.dias.forEach(d=>{
  const b=document.createElement('button');
  b.className='dia'; b.type='button'; b.dataset.dia=d.nombre;
  b.innerHTML='<b>'+d.corto+'</b><span>'+d.num+'</span>';
  b.setAttribute('aria-label', d.nombre+' '+d.num+' de septiembre');
  b.onclick=function(){ diaSel=d.nombre; q.value=''; qAntes=''; pinta(); };
  elDias.appendChild(b);
});

/* --- chips de tema --- */
D.filtros.forEach(f=>{
  const b=document.createElement('button');
  b.className='chip'; b.type='button'; b.dataset.f=f.id;
  const color = f.id==='ELI' ? '#EC407A' : (D.tracks[f.id] ? D.tracks[f.id].color : null);
  b.innerHTML=(color?'<i class="punto" style="background:'+color+'"></i>':'')+f.et;
  b.onclick=()=>{ filtro=(filtro===f.id?'TODOS':f.id); pinta(); };
  elChips.appendChild(b);
});

document.getElementById('ahora').onclick=function(){
  q.value=''; qAntes=''; filtro='TODOS';
  diaSel = diaDeHoy() || D.dias[0].nombre;
  pinta();
  var destino = document.querySelector('.encurso');
  if(!destino){
    /* Nada en curso: llevamos a la siguiente franja del día, o a la última si ya terminó. */
    var franjas = document.querySelectorAll('.franja'), t = ahoraMin(), i;
    for(i=0;i<franjas.length;i++){
      if(min(franjas[i].getAttribute('data-ini')) >= t){ destino = franjas[i]; break; }
    }
    if(!destino && franjas.length) destino = franjas[franjas.length-1];
  }
  if(destino && destino.scrollIntoView) destino.scrollIntoView({block:'center', behavior:'smooth'});
};

var qAntes = '';
q.addEventListener('input', function(){
  var ahora = q.value.trim();
  /* Solo al pasar de vacío a con texto: así, si ya estás buscando,
     puedes tocar un filtro y se combina con lo que llevas escrito. */
  if(qAntes === '' && ahora !== '') filtro = 'TODOS';
  qAntes = ahora;
  pinta();
});

/* Algunas sesiones incluyen paneles o charlas sin número de artículo:
   se cuentan solo las ponencias numeradas para no llamarles "ponencia". */
function etiquetaPon(pon){
  var n=0, i;
  for(i=0;i<pon.length;i++){ if(pon[i].n) n++; }
  if(!n) return 'Ver detalle';
  return n+' ponencia'+(n>1?'s':'');
}

/* --- construcción de una tarjeta --- */
function tarjeta(s, conDia){
  const t = D.tracks[s.track] || {nombre:s.track, color:'#8b919e'};
  const d = document.createElement(s.pon.length || s.estado==='por-confirmar' ? 'details' : 'div');
  d.className='tarjeta';
  d.style.borderLeftColor=t.color;
  if(esHoy() && !conDia){
    if(min(s.fin)<=ahoraMin()) d.classList.add('pasada');
    else if(min(s.ini)<=ahoraMin()) d.classList.add('encurso');
  }
  const cab = s.pon.length||s.estado==='por-confirmar' ? document.createElement('summary')
                                                       : document.createElement('div');
  if(cab.tagName==='DIV') cab.style.padding='11px 13px';
  let meta=[];
  if(s.cod) meta.push('<span class="cod">'+s.cod+'</span>');
  meta.push(s.tipo);
  if(conDia) meta.push(s.dia+' '+s.ini);
  cab.innerHTML =
    '<div class="sala">'+s.sala+'</div>'+
    '<div class="meta">'+meta.join(' · ')+'</div>'+
    (s.sub?'<div class="sub">'+s.sub+'</div>':'')+
    (s.pon.length?'<div class="pie">'+etiquetaPon(s.pon)+'</div>':'')+
    (s.estado==='por-confirmar'?'<div class="pie">Programa por confirmar</div>':'');
  d.appendChild(cab);
  if(s.pon.length){
    const ul=document.createElement('ul'); ul.className='lista';
    s.pon.forEach(p=>{ const li=document.createElement('li');
      li.innerHTML=(p.n?'<span class="num">#'+p.n+'</span>':'')+p.t; ul.appendChild(li); });
    d.appendChild(ul);
  } else if(s.estado==='por-confirmar'){
    const p=document.createElement('div'); p.className='pendiente';
    p.innerHTML='<strong>Todavía sin detalle</strong>El horario y la sala ya están confirmados. '+
                'Los títulos se publicarán en cuanto el comité los entregue.';
    d.appendChild(p);
  }
  return d;
}

function banda(s){
  const d=document.createElement('div'); d.className='log';
  d.innerHTML='<span class="raya"></span><b>'+s.sub+'</b> '+s.ini+'–'+s.fin+'<span class="raya"></span>';
  return d;
}

/* --- filtros --- */
function pasa(s){
  if(filtro!=='TODOS' && s.grupo!==filtro && s.grupo!=='LOG') return false;
  if(filtro!=='TODOS' && s.grupo==='LOG') return false;
  return true;
}
function coincide(s, txt){
  var b=[s.sala,s.cod,s.tipo,s.sub,(D.tracks[s.track]||{}).nombre]
          .concat(s.pon.map(function(p){ return p.t; })).join(' ').toLowerCase();
  return b.includes(txt);
}

/* --- pintado --- */
function pinta(){
  const txt=q.value.trim().toLowerCase();
  Array.prototype.slice.call(elDias.children).forEach(b=>b.setAttribute('aria-pressed', b.dataset.dia===diaSel && !txt));
  Array.prototype.slice.call(elChips.children).forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===filtro));
  prog.innerHTML='';

  if(txt){ pintaBusqueda(txt); return; }

  const dia=D.sesiones.filter(s=>s.dia===diaSel && pasa(s));
  if(!dia.length){ vacio('No hay nada de este tema el '+diaSel.toLowerCase(),
    'Prueba con otro día o quita el filtro.'); return; }

  var vistas={}, franjas=[];
  dia.forEach(function(s){ var k=s.ini+'|'+s.fin; if(!vistas[k]){ vistas[k]=1; franjas.push(k); } });
  franjas = franjas
    .sort((a,b)=>min(a.split('|')[0])-min(b.split('|')[0]));

  franjas.forEach(f=>{
    const [ini,fin]=f.split('|');
    const bloque=dia.filter(s=>s.ini===ini && s.fin===fin);
    const soloLog=bloque.every(s=>s.grupo==='LOG');
    if(soloLog){ bloque.forEach(s=>prog.appendChild(banda(s))); return; }
    var h=document.createElement('div'); h.className='franja'; h.setAttribute('data-ini', ini);
    const enCurso = esHoy() && min(ini)<=ahoraMin() && ahoraMin()<min(fin);
    h.innerHTML='<span class="hora">'+ini+'–'+fin+'</span>'+
      (enCurso?'<span class="ahora">EN CURSO</span>':'')+'<span class="raya"></span>';
    prog.appendChild(h);
    bloque.forEach(s=>prog.appendChild(s.grupo==='LOG'?banda(s):tarjeta(s,false)));
  });
}

function pintaBusqueda(txt){
  const res=D.sesiones.filter(s=>s.grupo!=='LOG' && pasa(s) && coincide(s,txt));
  const c=document.createElement('div'); c.className='cuenta';
  c.textContent = res.length ? res.length+' sesion'+(res.length>1?'es':'')+' con "'+q.value.trim()+'"' : '';
  prog.appendChild(c);
  if(!res.length){ vacio('Sin resultados para "'+q.value.trim()+'"',
    'Revisa la escritura o busca una palabra más corta del título.'); return; }
  D.dias.forEach(d=>{
    const grupo=res.filter(s=>s.dia===d.nombre);
    if(!grupo.length) return;
    const h=document.createElement('div'); h.className='diares';
    h.textContent=d.nombre+' '+d.num+' de septiembre';
    prog.appendChild(h);
    grupo.sort((a,b)=>min(a.ini)-min(b.ini)).forEach(s=>prog.appendChild(tarjeta(s,true)));
  });
}

function vacio(t,s){
  const d=document.createElement('div'); d.className='vacio';
  d.innerHTML='<b>'+t+'</b>'+s; prog.appendChild(d);
}

pinta();
}

/* Red de seguridad: si algo falla, se ve en pantalla en lugar de quedar en blanco. */
function mostrarError(e){
  document.getElementById('prog').innerHTML =
    '<div class="vacio"><b>No se pudo cargar el programa</b>'+
    'Vuelve a intentarlo o ábrela en otro dispositivo. Detalle técnico: '+
    (e && e.message ? e.message : e)+'</div>';
}
try { iniciarPrograma(); } catch (e) { mostrarError(e); }
</script>
